# --- エンコーディング ---
# tmuxはUTF-8がデフォルトなので明示的な設定は不要だが念のため
set -gq utf8 on
set -gq status-utf8 on

# --- プレフィックスキー (screen の escape ^t^t に相当) ---
unbind C-b
set -g prefix C-t
bind C-t send-prefix

# --- ウィンドウ切り替え (screen の bind ^T other に相当) ---
# 直前のウィンドウに切り替え
bind C-t last-window
bind C-p previous-window

# --- ペインフォーカス (screen の bind o focus に相当) ---
# 次のペインにフォーカス
bind o select-pane -t :.+

# ウインドウ作成
bind C-c new-window

# 次のウインドウ
bind -r C-Space next-window

# --- ターミナル設定 ---
set -g default-terminal "tmux-256color"
# TrueColor / 256色対応 (Claude Codeの色崩れ対策)
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",tmux-256color:RGB"

# --- ステータスバー (screen の caption に相当) ---
# %{=b wk} %-w%{=bu db}%n %t%{-}%+w %= %{=b wb}%y/%m/%d
set -g status on
set -g status-interval 1
set -g status-style "fg=white,bg=black,bold"

# 左側: 非アクティブウィンドウリスト
set -g status-left ""
set -g status-left-length 0

# 中央: ウィンドウリスト (アクティブウィンドウをハイライト)
set -g status-justify left
setw -g window-status-format " #I #W "
setw -g window-status-style "fg=white,bg=black,bold"
setw -g window-status-current-format " #I #W "
setw -g window-status-current-style "fg=black,bg=white,bold,underscore"

# 右側: 日付 (screen の %y/%m/%d に相当)
set -g status-right-length 20
set -g status-right "#[fg=white,bg=black,bold] %y/%m/%d"

# --- ベル設定 (screen の vbell off に相当) ---
set -g visual-bell off
set -g bell-action none

# --- スクロールバック (screen の defscrollback 50000 に相当) ---
set -g history-limit 50000

# --- 背景色消去の修正 (screen の defbce on に相当) ---
set -ag terminal-overrides ",*:bce=on"

# --- ログ (screen の logfile に相当) ---
# tmuxのlogging-pluginが別途必要だが、組み込みのpipe-paneで代替可能
# 手動ログ開始: Prefix + P (任意)
bind P pipe-pane -o "cat >> $HOME/.tmux/logs/tmux_%Y%m%d.log" \; display "Logging toggled"

# --- その他の推奨設定 ---
# ESCキーの遅延をなくす (Vimなどで有用)
set -sg escape-time 0

# ウィンドウ番号を1始まりに
set -g base-index 1
setw -g pane-base-index 1

# ウィンドウを閉じた後に番号を詰める
set -g renumber-windows on

# マウス操作を有効化
set -g mouse on

