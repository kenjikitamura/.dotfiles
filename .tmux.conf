# --- プレフィックスキー (screen の escape ^t^t に相当) ---
unbind C-b
set -g prefix C-t
# Prefix + t で C-t そのものをアプリに送る (C-t C-t は下の last-window)
bind t send-prefix

# --- ウィンドウ切り替え (screen の bind ^T other に相当) ---
# 直前のウィンドウに切り替え
bind C-t last-window
bind C-p previous-window

# --- ペインフォーカス (screen の bind o focus に相当) ---
# 次のペインにフォーカス
bind o select-pane -t :.+

# ウインドウ作成
bind C-c new-window

# 次のウインドウ
bind -r C-Space next-window

# --- ターミナル設定 ---
set -g default-terminal "tmux-256color"
# TrueColor / 256色対応 (Claude Codeの色崩れ対策)
set -as terminal-features ",xterm-256color:RGB"
# Shift+Enter などの修飾キーをアプリに渡す (Claude Code 用)
set -s extended-keys on
set -as terminal-features ",xterm*:extkeys"
# フォーカスの出入りをアプリに伝える (Vim / Claude Code 用)
set -g focus-events on

# --- ステータスバー (screen の caption に相当) ---
# %{=b wk} %-w%{=bu db}%n %t%{-}%+w %= %{=b wb}%y/%m/%d
set -g status on
set -g status-interval 60
set -g status-style "fg=white,bg=black,bold"

# 左側: 非アクティブウィンドウリスト
set -g status-left ""
set -g status-left-length 0

# 中央: ウィンドウリスト (アクティブウィンドウをハイライト)
set -g status-justify left
# Claude Code の実行状況 (@claude: ⏳ 作業中 / ❓ 確認待ち / ✅ 完了) を名前の後ろに付ける
# (@claude は ~/.claude/settings.json の hooks が設定する)
# ズーム中のウィンドウには [Z] を付ける
setw -g window-status-format " #I #W#{?@claude, #{@claude},}#{?window_zoomed_flag, [Z],} "
setw -g window-status-style "fg=white,bg=black,bold"
setw -g window-status-current-format " #I #W#{?@claude, #{@claude},}#{?window_zoomed_flag, [Z],} "
setw -g window-status-current-style "fg=black,bg=white,bold,underscore"

# ウィンドウ名: zsh の preexec / precmd が送る名前 (\ek...\e\\) を使う
# (実行中はコマンド名、待っている間はディレクトリ名。設定は ~/.zshrc)
# zsh 以外のウィンドウは自動命名 (automatic-rename) で、実行中のコマンド名になる
setw -g allow-rename on
# 自動命名の書式 (zsh から名前が届かないウィンドウ用)
# - zsh で待っている間: ディレクトリ名
# - Claude Code: プロセス名がバージョン番号 (例: 2.1.325) になるため、claude:<ディレクトリ名> にする
# - それ以外: 実行中のコマンド名
setw -g automatic-rename-format '#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{?#{m/r:^[0-9]+(\.[0-9]+)+$,#{pane_current_command}},claude:#{b:pane_current_path},#{pane_current_command}}}'

# 右側: 日付 (screen の %y/%m/%d に相当)
set -g status-right-length 20
set -g status-right "#[fg=white,bg=black,bold] %y/%m/%d"

# --- ベル設定 (screen の vbell off に相当) ---
set -g visual-bell off
# 表示していないウィンドウでベルが鳴ったら (Claude Code の完了通知など) ステータスバーで目立たせる
set -g bell-action other
setw -g monitor-bell on
setw -g window-status-bell-style "fg=black,bg=yellow,bold"

# --- スクロールバック (screen の defscrollback 50000 に相当) ---
set -g history-limit 50000

# --- ログ (screen の logfile に相当) ---
# 組み込みの pipe-pane で代替。Prefix + P でログの開始/停止を切り替える
# (screen の defbce on は tmux が自前で処理するため設定不要)
bind P pipe-pane -o "mkdir -p $HOME/.tmux/logs && cat >> $HOME/.tmux/logs/tmux_%Y%m%d.log" \; display "Logging toggled"

# --- その他の推奨設定 ---
# ESCキーの遅延をなくす (Vimなどで有用)
set -sg escape-time 0

# ウィンドウ番号を1始まりに
set -g base-index 1
setw -g pane-base-index 1

# ウィンドウを閉じた後に番号を詰める
set -g renumber-windows on

# マウス操作を有効化
set -g mouse on

